<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixal3D</title>
  <link rel="stylesheet" href="/static/styles.css?v=4" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>Pixal3D</h1>
        <p class="tag">Image → textured GLB</p>
      </div>
      <div class="health-wrap">
        <div id="health" class="health">Checking GPU…</div>
        <div id="vram" class="vram">VRAM: —</div>
      </div>
    </header>

    <main class="grid">
      <section class="panel left">
        <div class="drop" id="drop" role="button" tabindex="0" aria-label="Upload image">
          <input id="fileInput" class="file-input" type="file" accept="image/*,.png,.jpg,.jpeg,.webp,.bmp" />
          <div id="dropHint" class="drop-hint">
            <strong>Drop an image</strong>
            <span>or click to browse</span>
          </div>
          <img id="preview" class="preview hidden" alt="Input preview" />
        </div>

        <div class="controls">
          <label class="field">
            <span>Preset</span>
            <select id="preset">
              <option value="preview">Preview (fast / light)</option>
              <option value="balanced" selected>Balanced (recommended)</option>
              <option value="max">Max quality (24GB+ headroom)</option>
            </select>
          </label>
          <label class="field">
            <span>Seed</span>
            <input id="seed" type="number" value="42" />
          </label>
          <label class="field">
            <span>Resolution</span>
            <select id="resolution">
              <option value="1024" selected>1024</option>
              <option value="1536">1536</option>
            </select>
          </label>
          <label class="field check">
            <input id="lowVram" type="checkbox" checked />
            <span>Low VRAM mode</span>
          </label>
          <details class="advanced">
            <summary>Advanced</summary>
            <label class="field">
              <span>Steps</span>
              <input id="steps" type="number" min="4" max="32" value="12" />
            </label>
            <label class="field">
              <span>Max tokens</span>
              <input id="maxTokens" type="number" min="8192" max="49152" step="1024" value="32768" />
            </label>
            <label class="field">
              <span>Texture size</span>
              <select id="textureSize">
                <option value="1024">1024</option>
                <option value="2048" selected>2048</option>
                <option value="4096">4096</option>
              </select>
            </label>
            <label class="field">
              <span>Decimation target</span>
              <input id="decimation" type="number" min="50000" max="1000000" step="50000" value="500000" />
            </label>
            <label class="field">
              <span>FOV (rad, -1 = auto)</span>
              <input id="fov" type="number" step="0.01" value="-1" />
            </label>
          </details>
        </div>

        <button id="generateBtn" class="btn" disabled>Generate</button>

        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="stageLabel">Idle</span>
            <span id="pctLabel">0%</span>
          </div>
          <div class="bar"><div id="barFill" class="bar-fill"></div></div>
        </div>
      </section>

      <section class="panel right">
        <div class="viewer-wrap">
          <model-viewer
            id="viewer"
            camera-controls
            touch-action="pan-y"
            exposure="1"
            shadow-intensity="0.6"
            environment-image="neutral"
            alt="Generated 3D model"
          >
            <div slot="poster" class="poster">3D preview appears here when generation finishes</div>
          </model-viewer>
          <a id="downloadLink" class="download hidden" href="#" download="pixal3d.glb">Download GLB</a>
        </div>

        <div class="console-wrap">
          <div class="console-head">Console</div>
          <pre id="console" class="console"></pre>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
